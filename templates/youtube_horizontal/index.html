<!doctype html>
<html lang="pt-BR" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      /* Top Left Logo / Module Tag */
      .header-bar {
        position: absolute;
        top: 48px;
        left: 64px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .brand-pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(245, 158, 11, 0.5);
        border-radius: 9999px;
        backdrop-filter: blur(16px);
      }
      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #f59e0b;
        box-shadow: 0 0 10px #f59e0b;
      }
      .brand-name {
        color: #f8fafc;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .module-badge {
        padding: 10px 20px;
        background: rgba(245, 158, 11, 0.15);
        border: 1px solid rgba(245, 158, 11, 0.3);
        border-radius: 12px;
        color: #fbbf24;
        font-size: 18px;
        font-weight: 700;
      }

      /* Lower-Third Modern Bar (Bottom Left) */
      .lower-third {
        position: absolute;
        bottom: 64px;
        left: 64px;
        display: flex;
        align-items: stretch;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(10, 15, 30, 0.9) 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        overflow: hidden;
        backdrop-filter: blur(24px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        max-width: 900px;
      }
      .lt-accent {
        width: 10px;
        background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      }
      .lt-content {
        padding: 24px 36px;
      }
      .lt-title {
        color: #ffffff;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.01em;
        margin-bottom: 6px;
      }
      .lt-title span.gold {
        color: #f59e0b;
      }
      .lt-desc {
        color: #94a3b8;
        font-size: 20px;
        font-weight: 500;
      }

      /* Floating Right Card / Feature Callout */
      .feature-callout {
        position: absolute;
        top: 140px;
        right: 64px;
        width: 420px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        padding: 32px;
        backdrop-filter: blur(20px);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      }
      .fc-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .fc-icon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: rgba(245, 158, 11, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }
      .fc-category {
        color: #fbbf24;
        font-size: 16px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .fc-title {
        color: #f8fafc;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.3;
        margin-bottom: 16px;
      }
      .fc-metric {
        padding: 14px;
        background: rgba(30, 41, 59, 0.7);
        border-radius: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .metric-label {
        color: #94a3b8;
        font-size: 16px;
        font-weight: 600;
      }
      .metric-val {
        color: #38bdf8;
        font-size: 20px;
        font-weight: 800;
      }

      /* End Screen CTA Overlay */
      .outro-cta {
        position: absolute;
        bottom: 64px;
        right: 64px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 36px;
        background: linear-gradient(90deg, #d97706 0%, #f59e0b 100%);
        border-radius: 9999px;
        box-shadow: 0 12px 35px rgba(245, 158, 11, 0.4);
      }
      .outro-text {
        color: #0f172a;
        font-size: 22px;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <!-- Header bar -->
      <div id="headerBar" class="header-bar">
        <div class="brand-pill">
          <div class="brand-dot"></div>
          <span class="brand-name">Marca Salão</span>
        </div>
        <div class="module-badge" id="moduleTag">Painel de Demonstração</div>
      </div>

      <!-- Lower-Third info -->
      <div id="lowerThird" class="lower-third">
        <div class="lt-accent"></div>
        <div class="lt-content">
          <h2 class="lt-title" id="ltTitle">Gestão Completa de <span class="gold">Clientes e Agenda</span></h2>
          <p class="lt-desc" id="ltDesc">Controle agendamentos, profissionais e faturamento em tempo real.</p>
        </div>
      </div>

      <!-- Feature Callout Card -->
      <div id="featureCard" class="feature-callout">
        <div class="fc-header">
          <div class="fc-icon">🚀</div>
          <span class="fc-category">Alta Performance</span>
        </div>
        <div class="fc-title" id="fcTitle">Automatize o envio de lembretes aos clientes</div>
        <div class="fc-metric">
          <span class="metric-label">Taxa de Presença</span>
          <span class="metric-val">+92%</span>
        </div>
      </div>

      <!-- Outro CTA -->
      <div id="outroCta" class="outro-cta">
        <span class="outro-text">Acesse marcasalao.com.br</span>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Entradas suaves
      tl.fromTo("#headerBar", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.3);
      tl.fromTo("#lowerThird", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.7, ease: "back.out(1.2)" }, 0.8);
      tl.fromTo("#featureCard", { opacity: 0, scale: 0.9, x: 40 }, { opacity: 1, scale: 1, x: 0, duration: 0.7, ease: "power3.out" }, 1.5);
      tl.fromTo("#outroCta", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, 3.0);

      // Micro movimento no CTA
      tl.to("#outroCta", { scale: 1.05, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 5.0);

      // Fade out de encerramento
      tl.to(["#headerBar", "#lowerThird", "#featureCard", "#outroCta"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 9.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
