name: Validar contratos da platform

# Gate do núcleo modular: roda apenas sobre o que pode quebrá-lo (a própria
# platform e este arquivo). O preview de vídeos (.github/workflows/video-preview.yml)
# continua com os gatilhos e os passos dele intactos.

on:
  push:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-validation.yml'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-validation.yml'
  workflow_dispatch:

# Só lê o repositório: o gate não publica, não faz deploy e não usa segredos.
permissions:
  contents: read

jobs:
  contratos:
    name: ${{ matrix.os }} · Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Um ambiente quebrado não deve esconder o veredito dos outros três.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Faixa de platform/package.json: "node": ">=22 <25".
        node-version: ['22', '24']

    defaults:
      run:
        # bash nos dois sistemas: pipefail e captura de exit code são os mesmos passos.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Instalação reprodutível (npm ci)
        working-directory: platform
        run: |
          mkdir -p gate-logs
          set -o pipefail
          npm ci 2>&1 | tee gate-logs/npm-ci.log

      - name: Limpeza dos artefatos locais
        working-directory: platform
        run: npm run clean

      - name: Verificação de tipos (tsc --noEmit)
        working-directory: platform
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee gate-logs/typecheck.log

      - name: Suíte completa com TAP integral (já inclui o corpus de contratos)
        working-directory: platform
        # O script npm test ja fixa --test-reporter=tap antes dos padroes de arquivo, entao o
        # log e TAP completo nos quatro ambientes da matriz. pipefail + exit "$code" preservam
        # o codigo original do npm test.
        run: |
          set -o pipefail
          npm test 2>&1 | tee gate-logs/npm-test.tap
          code=$?
          echo "npm test exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          echo "npm test exit code: $code"
          exit "$code"

      - name: Publicar logs do gate (apenas em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-${{ matrix.os }}-node${{ matrix.node-version }}
          path: platform/gate-logs/**
          if-no-files-found: warn
          retention-days: 30
