name: Validar render local de prova

# Gate dedicado do adaptador de render local: render REAL com FFmpeg/FFprobe
# nos dois sistemas, usando a suite Python e os dois pacotes versionados.
# A matriz Node 22/24 da platform continua no workflow platform-validation.yml.
# O job falha se faltar ferramenta, se a ponte estiver indisponivel ou se os
# testes obrigatorios de render forem pulados (REQUIRE_RENDER=1).

on:
  push:
    paths:
      - 'tools/**'
      - 'platform/**'
      - '.github/workflows/local-render-validation.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'platform/**'
      - '.github/workflows/local-render-validation.yml'
  workflow_dispatch:

# So le o repositorio: o gate nao publica, nao faz deploy e nao usa segredos.
permissions:
  contents: read

jobs:
  render-real:
    name: ${{ matrix.os }} · render real
    runs-on: ${{ matrix.os }}
    strategy:
      # Um ambiente quebrado nao deve esconder o veredito do outro.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (ponte TypeScript)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: FFmpeg e FFprobe (builds verificaveis BtbN via acao oficial)
        uses: FedericoCarboni/setup-ffmpeg@v2

      - name: Versoes registradas das ferramentas
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          node --version
          python --version

      - name: Ferramentas obrigatorias presentes
        run: |
          command -v ffmpeg
          command -v ffprobe
          command -v node
          command -v python

      - name: Instalar e compilar a ponte TypeScript
        working-directory: platform
        run: |
          npm ci
          npm run build
          test -f dist/src/validate-local-render-input.js

      - name: Suite Python com render obrigatorio (sem skips permitidos)
        env:
          REQUIRE_RENDER: '1'
        run: python -m unittest discover -s tools/tests -v

      - name: Prova dos dois pacotes versionados (fixtures dentro da raiz)
        run: |
          python tools/make_proof_assets.py \
            --package platform/examples/execution-packages/execution-marca-salao-social-reel-example-instagram-reels-video-social-reel-beat-plan.execution-package.json \
            --output-dir .workspace/tmp/local-render-adapter-v1/assets/marca-salao
          python tools/make_proof_assets.py \
            --package platform/examples/execution-packages/execution-multitrack-hub-multitrack-social-reel-example-instagram-reels-video-multitrack-social-reel-beat-plan.execution-package.json \
            --output-dir .workspace/tmp/local-render-adapter-v1/assets/multitrack-hub
          python tools/render_local.py \
            --package platform/examples/execution-packages/execution-marca-salao-social-reel-example-instagram-reels-video-social-reel-beat-plan.execution-package.json \
            --assets tools/render/marca-salao.assets.json \
            --output-dir .workspace/archives/ci-render/marca-salao --json
          python tools/render_local.py \
            --package platform/examples/execution-packages/execution-multitrack-hub-multitrack-social-reel-example-instagram-reels-video-multitrack-social-reel-beat-plan.execution-package.json \
            --assets tools/render/multitrack-hub.assets.json \
            --output-dir .workspace/archives/ci-render/multitrack-hub --json

      - name: Inspecao FFprobe dos videos promovidos
        run: |
          ffprobe -v error -show_streams -show_format -of json \
            .workspace/archives/ci-render/marca-salao/*-primary-output.mp4
          ffprobe -v error -show_streams -show_format -of json \
            .workspace/archives/ci-render/multitrack-hub/*-primary-output.mp4

      - name: Previa do plano do pipeline (--plan-only)
        run: |
          python tools/render_pipeline.py \
            --case platform/examples/pipelines/marca-salao-pipeline-pilot.pipeline.json \
            --plan-only --json
          python tools/render_pipeline.py \
            --case platform/examples/pipelines/multitrack-hub-pipeline-pilot.pipeline.json \
            --plan-only --json

      - name: Prova do pipeline local com os dois casos versionados
        run: |
          python tools/make_proof_assets.py \
            --case platform/examples/pipelines/marca-salao-pipeline-pilot.pipeline.json \
            --output-dir .workspace/tmp/pipeline-assets/marca-salao
          python tools/make_proof_assets.py \
            --case platform/examples/pipelines/multitrack-hub-pipeline-pilot.pipeline.json \
            --output-dir .workspace/tmp/pipeline-assets/multitrack-hub
          python tools/render_pipeline.py \
            --case platform/examples/pipelines/marca-salao-pipeline-pilot.pipeline.json \
            --assets tools/render/marca-salao.assets.json \
            --output-dir .workspace/archives/ci-pipeline/marca-salao --json
          python tools/render_pipeline.py \
            --case platform/examples/pipelines/multitrack-hub-pipeline-pilot.pipeline.json \
            --assets tools/render/multitrack-hub.assets.json \
            --output-dir .workspace/archives/ci-pipeline/multitrack-hub --json

      - name: Inspecao FFprobe e manifestos do pipeline promovido
        run: |
          ffprobe -v error -show_streams -show_format -of json \
            .workspace/archives/ci-pipeline/marca-salao/*-primary-output.mp4
          ffprobe -v error -show_streams -show_format -of json \
            .workspace/archives/ci-pipeline/multitrack-hub/*-primary-output.mp4
          python -c "import json; m=json.load(open('.workspace/archives/ci-pipeline/marca-salao/delivery-manifest.json')); assert m['schemaVersion']==1 and m['caseId']=='marca-salao-pipeline-pilot'"
          python -c "import json; m=json.load(open('.workspace/archives/ci-pipeline/multitrack-hub/delivery-manifest.json')); assert m['schemaVersion']==1 and m['caseId']=='multitrack-hub-pipeline-pilot'"

      - name: Prova do piloto de composicao com titulos editaveis (--text-overlays)
        run: |
          python -c "import json; json.dump({'schemaVersion': 1, 'caseId': 'marca-salao-pipeline-pilot', 'overlays': [{'beatId': 'demonstration-body', 'text': 'Titulo CI Editavel'}]}, open('.workspace/tmp/ci-title-overlays.json', 'w'))"
          python tools/render_pipeline.py \
            --case platform/examples/pipelines/marca-salao-pipeline-pilot.pipeline.json \
            --text-overlays .workspace/tmp/ci-title-overlays.json \
            --plan-only --json
          python tools/render_pipeline.py \
            --case platform/examples/pipelines/marca-salao-pipeline-pilot.pipeline.json \
            --assets tools/render/marca-salao.assets.json \
            --text-overlays .workspace/tmp/ci-title-overlays.json \
            --output-dir .workspace/archives/ci-pipeline/marca-salao-title --json
          ffprobe -v error -show_streams -show_format -of json \
            .workspace/archives/ci-pipeline/marca-salao-title/*-primary-output.mp4
          python -c "import json; m=json.load(open('.workspace/archives/ci-pipeline/marca-salao-title/delivery-manifest.json')); assert 'textOverlayPlan' in m['artifacts']"

      - name: Prova do piloto de composicao com estilos visuais (--visual-style)
        run: |
          python -c "import json; json.dump({'schemaVersion': 1, 'id': 'ci-gold-style', 'title': {'textColor': '#FFD700', 'outlineColor': '#000000', 'fontSize': 46, 'marginTop': 180, 'marginHorizontal': 80}}, open('.workspace/tmp/ci-visual-style.json', 'w'))"
          python tools/render_pipeline.py \
            --case platform/examples/pipelines/marca-salao-pipeline-pilot.pipeline.json \
            --text-overlays .workspace/tmp/ci-title-overlays.json \
            --visual-style .workspace/tmp/ci-visual-style.json \
            --plan-only --json
          python tools/render_pipeline.py \
            --case platform/examples/pipelines/marca-salao-pipeline-pilot.pipeline.json \
            --assets tools/render/marca-salao.assets.json \
            --text-overlays .workspace/tmp/ci-title-overlays.json \
            --visual-style .workspace/tmp/ci-visual-style.json \
            --output-dir .workspace/archives/ci-pipeline/marca-salao-style --json
          ffprobe -v error -show_streams -show_format -of json \
            .workspace/archives/ci-pipeline/marca-salao-style/*-primary-output.mp4
          python -c "import json; m=json.load(open('.workspace/archives/ci-pipeline/marca-salao-style/delivery-manifest.json')); assert 'visualStyle' in m['artifacts'] and m['visualStyleId']=='ci-gold-style'"

      - name: Prova do inventario de midia de ponta a ponta (--asset-manifest)
        run: |
          python -c "import json, os, sys; sys.path.insert(0, 'tools'); import make_proof_assets; d='.workspace/tmp/ci-asset-manifest'; os.makedirs(d, exist_ok=True); make_proof_assets.write_scene_png(f'{d}/shared.png', 'marca-salao', 'opening-hook', 1); make_proof_assets.write_scene_mp4(f'{d}/demo.mp4', 'marca-salao', 'demonstration-body', 2, duration_s=6.0); pkg=json.load(open('tools/render/marca-salao.assets.json'))['packageId']; json.dump({'schemaVersion': 1, 'packageId': pkg, 'assets': [{'beatId': 'opening-hook', 'path': f'{d}/shared.png'}, {'beatId': 'demonstration-body', 'path': f'{d}/demo.mp4'}, {'beatId': 'closing-cta', 'path': f'{d}/shared.png'}]}, open(f'{d}/ms.assets.json', 'w'), indent=2)"
          python tools/prepare_asset_manifest.py \
            --case platform/examples/pipelines/marca-salao-pipeline-pilot.pipeline.json \
            --assets .workspace/tmp/ci-asset-manifest/ms.assets.json \
            --origin ci-synthetic-proof \
            --license owned-synthetic \
            --output .workspace/tmp/ci-asset-manifest/ms.asset-manifest.json \
            --json
          python tools/render_pipeline.py \
            --case platform/examples/pipelines/marca-salao-pipeline-pilot.pipeline.json \
            --asset-manifest .workspace/tmp/ci-asset-manifest/ms.asset-manifest.json \
            --plan-only --json
          python tools/render_pipeline.py \
            --case platform/examples/pipelines/marca-salao-pipeline-pilot.pipeline.json \
            --asset-manifest .workspace/tmp/ci-asset-manifest/ms.asset-manifest.json \
            --check-assets --json
          python tools/render_pipeline.py \
            --case platform/examples/pipelines/marca-salao-pipeline-pilot.pipeline.json \
            --asset-manifest .workspace/tmp/ci-asset-manifest/ms.asset-manifest.json \
            --text-overlays .workspace/tmp/ci-title-overlays.json \
            --visual-style .workspace/tmp/ci-visual-style.json \
            --output-dir .workspace/archives/ci-pipeline/marca-salao-asset-manifest --json
          python -c "import glob, json, subprocess; m=json.load(open('.workspace/archives/ci-pipeline/marca-salao-asset-manifest/delivery-manifest.json')); assert 'assetManifest' in m['artifacts'] and m['assetManifestSummary']['assetCount']==2 and m['visualStyleId']=='ci-gold-style'; mp4=glob.glob('.workspace/archives/ci-pipeline/marca-salao-asset-manifest/*-primary-output.mp4')[0]; info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json',mp4], text=True)); streams=info['streams']; assert sum(1 for s in streams if s.get('codec_type')=='video')==1 and sum(1 for s in streams if s.get('codec_type')=='audio')==0"

      - name: Prova da producao por entrada unica (produce_video, tres destinos por pedido)
        run: |
          python tools/make_request_media.py --input tools/produce/examples/marca-salao-social-reel.video-request.json
          python tools/make_request_media.py --input tools/produce/examples/multitrack-hub-social-reel.video-request.json
          python tools/produce_video.py --input tools/produce/examples/marca-salao-social-reel.video-request.json --plan-only --json
          python tools/produce_video.py --input tools/produce/examples/marca-salao-social-reel.video-request.json --output-dir .workspace/archives/ci-produce/marca-salao --json
          python tools/produce_video.py --input tools/produce/examples/multitrack-hub-social-reel.video-request.json --output-dir .workspace/archives/ci-produce/multitrack-hub --json
          python - <<'PY'
          import glob, json, subprocess
          for brand in ('marca-salao', 'multitrack-hub'):
              index = json.load(open(f'.workspace/archives/ci-produce/{brand}/index.json'))
              assert index['completedCount'] == 3, index
              for profile in ('instagram-reels-video', 'facebook-reels-video', 'youtube-shorts'):
                  mp4 = glob.glob(f'.workspace/archives/ci-produce/{brand}/{profile}/*-primary-output.mp4')[0]
                  info = json.loads(subprocess.check_output(['ffprobe', '-v', 'error', '-show_streams', '-of', 'json', mp4], text=True))
                  streams = info['streams']
                  video = [s for s in streams if s.get('codec_type') == 'video']
                  assert len(video) == 1 and int(video[0]['width']) == 1080 and int(video[0]['height']) == 1920
                  assert sum(1 for s in streams if s.get('codec_type') == 'audio') == 0
          print('produce_video CI proof ok: 6 videos, 0 audio, 1080x1920')
          PY

      - name: Prova do painel local Video Studio (HTTP em 127.0.0.1)
        run: |
          python tools/video_studio.py --check --json
          python - <<'PY'
          import json, os, shutil, subprocess, time, urllib.parse, urllib.request
          p = subprocess.Popen(['python', 'tools/video_studio.py', '--port', '8799'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          base = 'http://127.0.0.1:8799'
          hdrs = {'Content-Type': 'application/json', 'Origin': base}
          def call(path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, headers=hdrs if data is not None else {})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))
          demo_id = None
          try:
              for _ in range(40):
                  try:
                      rd = call('/api/readiness')
                      if rd['ok'] and rd['readiness']['ready']:
                          break
                  except Exception:
                      time.sleep(0.25)
              else:
                  raise RuntimeError('Studio nao ficou pronto na porta 8799')
              with urllib.request.urlopen(base + '/', timeout=15) as r:
                  html = r.read().decode('utf-8')
                  assert 'Trabalhos &amp; Projetos' in html or 'Trabalhos' in html
              projs = call('/api/projects')
              assert projs['ok'] and any(x['id'] == 'marca-salao' for x in projs['projects'])
              created = call('/api/projects/create', {
                  'schemaVersion': 1, 'id': 'ci-studio-proj', 'name': 'CI Studio',
                  'locale': 'pt-BR', 'timezone': 'America/Sao_Paulo',
                  'brandTheme': 'ci-studio', 'assetRoot': '.workspace/studio/projects/ci-studio-proj/assets',
                  'contentPolicies': {'requireApprovedBriefing': True, 'requireApprovedScript': True, 'prohibitPersonalData': True, 'requireFunctionalEvidence': True},
                  'outputProfiles': ['instagram-reels-video', 'facebook-reels-video', 'youtube-shorts', 'instagram-feed-image-square'],
              })
              proj_path = created['path']
              v_prof = call('/api/profiles?' + urllib.parse.urlencode({'project': proj_path, 'module': 'video'}))['listing']['compatibleProfiles']
              c_prof = call('/api/profiles?' + urllib.parse.urlencode({'project': proj_path, 'module': 'carousel'}))['listing']['compatibleProfiles']
              m_prof = call('/api/profiles?' + urllib.parse.urlencode({'project': proj_path, 'module': 'motion'}))['listing']['compatibleProfiles']
              assert {x['id'] for x in v_prof} == {'instagram-reels-video', 'facebook-reels-video', 'youtube-shorts'}
              assert [x['id'] for x in c_prof] == ['instagram-feed-image-square']
              assert {x['id'] for x in m_prof} == {'instagram-reels-video', 'facebook-reels-video', 'youtube-shorts'}
              wk = call('/api/works/create', {'id': 'ci-studio-work', 'name': 'CI Work', 'project': proj_path, 'template': 'marca-salao'})
              assert wk['ok'] and wk['work']['id'] == 'ci-studio-work'
              wk['videoRequest']['title'] = 'CI Work Editado'
              saved = call('/api/works/save', {'workId': 'ci-studio-work', 'videoRequest': wk['videoRequest'], 'carouselRequest': wk['carouselRequest'], 'motionPlan': wk['motionPlan']})
              assert saved['ok']
              reopened = call('/api/works/open?id=ci-studio-work')
              assert reopened['ok'] and reopened['videoRequest']['title'] == 'CI Work Editado' and len(reopened['motionPlan']['effects']) == 1
              prev = call('/api/preview', {'request': reopened['videoRequest'], 'motionPlan': reopened['motionPlan']})
              assert prev['ok'] and prev['result']['status'] == 'preview' and len(prev['result']['profiles']) == 3
              demo = call('/api/works/demo', {'brand': 'multitrack-hub'})
              assert demo['ok'] and demo['work']['projectId'] == 'multitrack-hub'
              demo_id = demo['work']['id']
              print('studio v1 CI HTTP proof ok: readiness, projects, modules, work save/open, preview & demo')
          finally:
              p.terminate()
              try:
                  p.wait(timeout=5)
              except Exception:
                  p.kill()
              for rel in ['.workspace/studio/projects/ci-studio-proj.project.json']:
                  if os.path.isfile(rel):
                      os.remove(rel)
              for wid in [x for x in ('ci-studio-work', demo_id) if x]:
                  d = f'.workspace/studio/works/{wid}'
                  if os.path.isdir(d):
                      shutil.rmtree(d, ignore_errors=True)
          PY

      - name: Prova de exportacao de carrossel (R003, JPEG 1080x1080 + ZIP)
        run: |
          python tools/make_request_media.py --input tools/produce/examples/marca-salao-carousel.carousel-request.json
          python tools/make_request_media.py --input tools/produce/examples/multitrack-hub-carousel.carousel-request.json
          python tools/produce_carousel.py --input tools/produce/examples/marca-salao-carousel.carousel-request.json --plan-only --json
          python tools/produce_carousel.py --input tools/produce/examples/marca-salao-carousel.carousel-request.json --output-dir .workspace/archives/ci-carousel/marca-salao --json
          python tools/produce_carousel.py --input tools/produce/examples/multitrack-hub-carousel.carousel-request.json --output-dir .workspace/archives/ci-carousel/multitrack-hub --json
          python - <<'PY'
          import glob, json, zipfile
          for brand in ('marca-salao', 'multitrack-hub'):
              base = f'.workspace/archives/ci-carousel/{brand}'
              m = json.load(open(f'{base}/carousel-manifest.json'))
              assert m['geometry']['width'] == 1080 and m['geometry']['height'] == 1080
              files = [c['file'] for c in m['cards']]
              assert files == sorted(files), files
              with zipfile.ZipFile(f'{base}/carousel.zip') as z:
                  assert z.namelist() == files
              for c in m['cards']:
                  data = open(c['path'], 'rb').read()
                  assert data[:3] == b'\xff\xd8\xff', c['file']
              print(brand, 'carousel ok:', files)
          print('carousel CI proof ok: JPEG 1080x1080 + ZIP na ordem, duas marcas')
          PY

      - name: Prova do efeito Motion (contorno animado, MP4 sem audio)
        run: |
          python tools/make_agenda_media.py --output .workspace/tmp/motion-demo/assets/marca-salao/agenda.png
          python tools/make_agenda_media.py --output .workspace/tmp/motion-demo/assets/multitrack-hub/agenda.png
          python tools/produce_video.py --input tools/produce/examples/marca-salao-motion.video-request.json --motion-plan tools/produce/examples/marca-salao-motion.motion-plan.json --plan-only --json
          python tools/produce_video.py --input tools/produce/examples/marca-salao-motion.video-request.json --motion-plan tools/produce/examples/marca-salao-motion.motion-plan.json --output-dir .workspace/archives/ci-motion/marca-salao --json
          python tools/produce_video.py --input tools/produce/examples/multitrack-hub-motion.video-request.json --motion-plan tools/produce/examples/multitrack-hub-motion.motion-plan.json --output-dir .workspace/archives/ci-motion/multitrack-hub --json
          python - <<'PY'
          import glob, json, subprocess
          for brand in ('marca-salao', 'multitrack-hub'):
              base = f'.workspace/archives/ci-motion/{brand}/instagram-reels-video'
              m = json.load(open(f'{base}/delivery-manifest.json'))
              assert 'motionPlan' in m['artifacts'], m['artifacts'].keys()
              mp4 = glob.glob(f'{base}/*-primary-output.mp4')[0]
              info = json.loads(subprocess.check_output(['ffprobe', '-v', 'error', '-show_streams', '-of', 'json', mp4], text=True))
              streams = info['streams']
              v = [s for s in streams if s.get('codec_type') == 'video'][0]
              assert int(v['width']) == 1080 and int(v['height']) == 1920
              assert sum(1 for s in streams if s.get('codec_type') == 'audio') == 0
              print(brand, 'motion ok: 1080x1920, 0 audio, motionPlan no manifesto')
          print('motion CI proof ok: contorno animado, duas marcas, sem audio')
          PY
