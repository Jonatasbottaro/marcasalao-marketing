name: Validar interface Astryx do Video Studio

on:
  push:
    paths:
      - 'tools/studio/frontend/**'
      - 'tools/studio/index.html'
      - 'tools/studio/app.js'
      - 'tools/video_studio.py'
      - 'tools/tests/test_studio_astryx_frontend.py'
      - '.github/workflows/studio-frontend-ci.yml'
  pull_request:
    paths:
      - 'tools/studio/frontend/**'
      - 'tools/studio/index.html'
      - 'tools/studio/app.js'
      - 'tools/video_studio.py'
      - 'tools/tests/test_studio_astryx_frontend.py'
      - '.github/workflows/studio-frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build-and-regression:
    name: ${{ matrix.os }} · Astryx Studio Frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/studio/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar e compilar interface React/Astryx
        working-directory: tools/studio/frontend
        run: |
          npm ci
          npm run build
          test -f dist/.vite/manifest.json

      - name: Regressao focada da entrega estatica e fallback
        env:
          PYTHONPATH: tools
        run: python -m unittest tools/tests/test_studio_astryx_frontend.py -v
